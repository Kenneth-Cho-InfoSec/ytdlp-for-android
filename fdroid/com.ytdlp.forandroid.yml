AntiFeatures:
  NonFreeNet:
    en-US: Rely on GitHub API to check and download yt-dlp updates
Categories:
  - Multimedia
License: GPL-3.0-only
AuthorName: Kenneth-Cho-InfoSec
WebSite: https://github.com/Kenneth-Cho-InfoSec/ytdlp-for-android
SourceCode: https://github.com/Kenneth-Cho-InfoSec/ytdlp-for-android
IssueTracker: https://github.com/Kenneth-Cho-InfoSec/ytdlp-for-android/issues
Changelog: https://github.com/Kenneth-Cho-InfoSec/ytdlp-for-android/blob/main/CHANGELOG.md
Donate: https://ko-fi.com/kennethchoinfosec

AutoName: ytdlp-for-android
Description: |-
  Native Android interface for the unmodified yt-dlp engine running
  locally on your device.

  Paste a link or share one from YouTube, pick a quality preset or an
  exact format, and download to your Download folder. Audio only mode,
  parallel downloading, background downloads with progress notification,
  download history with one tap redownload, and an in app yt-dlp updater
  are all included.

  No account, no ads, no tracking.

RepoType: git
Repo: https://github.com/Kenneth-Cho-InfoSec/ytdlp-for-android

Builds:
  - versionName: 0.1.1
    versionCode: 2
    commit: v0.1.1
    subdir: app
    gradle:
      - yes
    prebuild: sed -i -e 's/isEnable = true/isEnable = false/' build.gradle.kts

AutoUpdateMode: Version +-(F-Droid) %v
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s=\s(\d+)||v(.*)
CurrentVersion: 0.1.1
CurrentVersionCode: 2
